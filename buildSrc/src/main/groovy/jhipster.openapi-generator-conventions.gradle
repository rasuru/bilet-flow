plugins {
    id "org.openapi.generator"
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$rootDir/src/main/resources/swagger/api.yml".toString()
    outputDir = layout.buildDirectory.dir("openapi").get().asFile.toString()
    apiPackage = "com.biletflow.biletflow.web.api"
    modelPackage = "com.biletflow.biletflow.service.api.dto"
    apiFilesConstrainedTo = [""]
    modelFilesConstrainedTo = [""]
    supportingFilesConstrainedTo = ["ApiUtil.java"]
    configOptions = [delegatePattern: "true", title: "bilet-flow", useSpringBoot3: "true"]
    validateSpec = true
    importMappings = [Problem:"org.springframework.http.ProblemDetail"]
}

sourceSets {
    main {
        java {
            srcDir(layout.buildDirectory.dir("openapi/src/main/java"))
        }
    }
}

tasks.named('compileJava').configure { dependsOn("openApiGenerate") }
